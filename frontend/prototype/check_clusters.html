<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    .container {
      position: relative;
      width: 540px; /* 1080 / 2 */
      height: 960px; /* 1920 / 2 */
      background: url('reference.png') no-repeat center;
      background-size: 100% 100%;
      border: 2px solid white;
    }
    .box {
      position: absolute;
      border: 1px solid red;
      background: rgba(255, 0, 0, 0.2);
      pointer-events: none;
      box-sizing: border-box;
    }
    .label {
      position: absolute;
      top: -12px;
      left: 0;
      background: red;
      color: white;
      font-size: 8px;
      padding: 1px 3px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Info -->
    <div class="box" style="top: 43.75%; left: 20.83%; width: 34.72%; height: 4.69%;">
      <div class="label">Top Info (Cluster 1): Y:43.75% L:20.83% W:34.72% H:4.69%</div>
    </div>

    <!-- Schedule Container -->
    <div class="box" style="top: 53.9%; left: 23.6%; width: 48.6%; height: 23.4%; border-color: blue; background: rgba(0, 0, 255, 0.15);">
      <div class="label" style="background: blue;">Schedule: Y:53.9% L:23.6% W:48.6% H:23.4%</div>
    </div>

    <!-- Units -->
    <div class="box" style="top: 78.1%; left: 68.0%; width: 14.5%; height: 4.0%; border-color: green; background: rgba(0, 255, 0, 0.15);">
      <div class="label" style="background: green;">Units: Y:78.1% L:68% W:14.5%</div>
    </div>

    <!-- Course -->
    <div class="box" style="top: 84.37%; left: 23.6%; width: 40.27%; height: 3.1%; border-color: purple; background: rgba(128, 0, 128, 0.15);">
      <div class="label" style="background: purple;">Course: Y:84.37% L:23.6% W:40.27%</div>
    </div>
  </div>
</body>
</html>
